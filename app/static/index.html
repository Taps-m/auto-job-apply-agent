<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareerAI — V 0.6.5</title>
<link rel="stylesheet" href="/static/styles.css?v=0.6.5">
<link rel="stylesheet" href="/static/dashboard-visuals.css?v=0.6.5">
<script src="/static/app.js?v=0.6.5" defer></script>
<script src="/static/dashboard-visuals.js?v=0.6.5" defer></script>
<script src="/static/discovery.js?v=0.6.5" defer></script>
<script src="/static/profile-cover-letter.js?v=0.6.5" defer></script>
<script src="/static/submission-controls.js?v=0.6.5" defer></script>
</head>
<body>
<header class="app-header">
  <a class="app-brand" href="#/home" aria-label="CareerAI home">
    <span class="app-brand-star" aria-hidden="true">✦</span>
    <span><span class="app-brand-name">CareerAI</span><span class="app-brand-tag">Your AI Job Search Agent</span></span>
  </a>
  <form id="global-search" class="app-search" role="search">
    <svg class="app-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input name="q" type="search" placeholder="Tell me what kind of jobs you're looking for…" aria-label="Search jobs">
    <button type="submit" class="app-search-go" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
  </form>
  <button type="button" class="ghost" id="chat-toggle" aria-controls="chat">Assistant</button>
</header>
  <nav class="top-navigation" aria-label="Main">
    <a href="#/home" data-nav="home">Home</a>
    <a href="#/jobs" data-nav="jobs">Jobs &amp; matches</a>
    <a href="#/applications" data-nav="applications">Applications</a>
    <a href="#/profile" data-nav="profile">Profile &amp; resume</a>
    <span id="version" class="sidebar-version muted"></span>
    <a href="#/settings" data-nav="settings" class="settings-nav">Settings</a>
  </nav>
<div class="shell">

  <div class="main">
    <main id="view" tabindex="-1"></main>
  </div>
  <aside id="chat" class="chat" aria-label="Gemini assistant">
    <div class="chat-head">
      <div class="agent-title"><span aria-hidden="true">✦</span><div><strong>Gemini Agent</strong><small>Your AI career assistant</small></div></div>
    </div>
    <div id="chat-status" class="chat-status"></div>
    <div id="chat-log" class="chat-log" aria-live="polite"></div>
    <div id="chat-actions"></div>
    <div id="chat-suggestions" class="chips"></div>
    <form id="chat-form">
      <textarea name="message" rows="2" placeholder="Connect Gemini to start chatting…" aria-label="Message" disabled></textarea>
      <button type="submit" disabled>Send</button>
    </form>
  </aside>
</div>
<footer class="copyright-bar">Copyright @Tapomoy 2026</footer>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
