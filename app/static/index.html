<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Job Assistant</title>
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="shell">
  <nav class="sidebar" aria-label="Main">
    <div class="brand">Personal Job Assistant <span id="version" class="muted"></span></div>
    <a href="#/home" data-nav="home">Home</a>
    <a href="#/jobs" data-nav="jobs">Jobs &amp; matches</a>
    <a href="#/applications" data-nav="applications">Applications</a>
    <a href="#/profile" data-nav="profile">Profile &amp; resume</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <div class="main">
    <header class="topbar">
      <form id="global-search" role="search">
        <input name="q" type="search" placeholder="Search jobs, e.g. credit risk jobs in Kolkata above 30 LPA" aria-label="Search jobs">
      </form>
      <button type="button" class="ghost" id="chat-toggle" aria-controls="chat">Assistant</button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
  <aside id="chat" class="chat" aria-label="Gemini assistant">
    <div class="chat-head">
      <strong>Assistant</strong>
      <select id="chat-sessions" aria-label="Conversation"></select>
      <button type="button" class="ghost small" id="chat-new">New</button>
    </div>
    <div id="chat-status" class="chat-status"></div>
    <div id="chat-log" class="chat-log" aria-live="polite"></div>
    <div id="chat-actions"></div>
    <div id="chat-suggestions" class="chips"></div>
    <form id="chat-form">
      <textarea name="message" rows="2" placeholder="Ask about jobs, fit, applications…" aria-label="Message"></textarea>
      <button type="submit">Send</button>
    </form>
  </aside>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
